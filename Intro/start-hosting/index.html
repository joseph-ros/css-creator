<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>uHost | Start Hosting</title>
    <link rel="shortcut icon" href="../images/favicon.ico">
    <link href="https://fonts.googleapis.com/css?family=Anton|Montserrat:400,700" rel="stylesheet">
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="start-hosting.css">
</head>

<body>
    <div class="backdrop"></div>
    <header class="main-header">
        <div>
            <a href="../index.html" class="main-header__brand">uHost</a>
        </div>
        <nav class="main-nav">
            <ul class="main-nav__items">
                <li class="main-nav__item">
                    <a href="../packages/index.html">Packages</a>
                </li>
                <li class="main-nav__item">
                    <a href="../customers/index.html">Customers</a>
                </li>
                <li class="main-nav__item main-nav__item--cta">
                    <a href="index.html">Start Hosting</a>
                </li>
            </ul>
        </nav>
    </header>
    
    <main class="signup-page">
    <h1 class="signup-title f-audiowide">Sign Up to Start Hosting</h1>
    <form action="index.html" class="signup-form">
        <label for="first-name">First name</label>
        <input type="text" id="first-name" placeholder="John" required>
        <label for="last-name">Last name</label>
        <input type="text" id="last-name" placeholder="Doe" required>
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="johndoe" minlength="3" pattern="^[a-zA-Z0-9_]+$" required>
        <label for="email">E-Mail</label>
        <input type="email" id="email" placeholder="john.doe@example.com" required>
        <label for="phone">Phone Number (Optional)</label>
        <input type="tel" id="phone" placeholder="+123 4567 8901">
        <label for="role">Account Type</label>
        <select id="role" required>
            <option value="" disabled selected hidden></option>
            <option value="web-developer">Web Developer</option>
            <option value="web-designer">Web Designer</option>
            <option value="graphic-designer">Graphic Designer</option>
            <option value="photographer">Photographer</option>
            <option value="videographer">Videographer</option>
            <option value="interior-designer">Interior Designer</option>
            <option value="software-engineer">Software Engineer</option>
            <option value="freelance-writer">Freelance Writer</option>
            <option value="technical-writer">Technical Writer</option>
            <option value="data-analyst">Data Analyst</option>
            <option value="digital-marketer">Digital Marketer</option>
            <option value="consultant">Consultant</option>
            <option value="ecommerce-store-owner">E-commerce Store Owner</option>
            <option value="freelance-translator">Freelance Translator</option>
            <option value="lawyer">Lawyer</option>
            <option value="accountant">Accountant</option>
            <option value="online-tutor">Online Tutor</option>
            <option value="real-estate-agent">Real Estate Agent</option>
            <option value="virtual-assistant">Virtual Assistant</option>
            <option value="social-media-manager">Social Media Manager</option>
            <option value="other">Other</option>
        </select>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="12345678" minlength="8" required>
        <div class="checkbox-group">
            <input type="checkbox" id="agree-terms" required>
            <label for="agree-terms">I agree to <a href="#">Terms & Conditions</a></label>
        </div>
        <button type="submit" class="button">Sign Up</button>
    </form>
</main>
    <footer class="main-footer">
        <nav>
            <ul class="main-footer__links">
                <li class="main-footer__link">
                    <a href="#">Support</a>
                </li>
                <li class="main-footer__link">
                    <a href="#">Terms of Use</a>
                </li>
            </ul>
        </nav>
    </footer>
    <script src="../shared.js"></script>
</body>
</html>
