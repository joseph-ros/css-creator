<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"/>
    <style>
      html,
      body {
        position: relative;
        height: 100%;
      }

      body {
        background: #444;
        font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #fff;
        margin: 0;
        padding: 0;
      }

      swiper-container {
        width: 1000px;
        height: 500px;
        position: absolute;
        left: 50%;
        top: 50%;
        margin-left: -500px;
        margin-top: -250px;
      }

      swiper-slide {
        background-position: center;
        background-size: cover;
      }

      swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <swiper-container class="mySwiper" pagination="true" effect="cube" cube-effect-shadow="true" cube-effect-slide-shadows="true" cube-effect-shadow-offset="20" cube-effect-shadow-scale="0.94" loop="true" autoplay-delay="2500" autoplay-disable-on-interaction="false">
      <swiper-slide>
        <img src="./test-images/slideshow-1.jpg"/>
      </swiper-slide>
      <swiper-slide>
        <img src="./test-images/slideshow-2.jpg"/>
      </swiper-slide>
      <swiper-slide>
        <img src="./test-images/slideshow-3.jpg"/>
      </swiper-slide>
    </swiper-container>
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-element-bundle.min.js"></script>
  </body>
</html>
